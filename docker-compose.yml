services:
  mongodb:
    image: mongo:7.0
    container_name: philoagents-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=philoagents
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./philoagents
      dockerfile: backend/Dockerfile
    container_name: philoagents-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - mongodb
    command: >
      sh -c "python -c 'import fastapi, uvicorn' >/dev/null 2>&1 || pip install --no-cache-dir -r requirements.txt;
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: philoagents-frontend
    working_dir: /app
    volumes:
      - ./philoagents/frontend:/app
      - philoagents_frontend_node_modules:/app/node_modules
    command: >
      sh -c "PKG_HASH=$$(sha256sum package.json | awk '{print $$1}');
      if [ ! -d node_modules ] || [ ! -f node_modules/.pkg_hash ] || [ \"$$(cat node_modules/.pkg_hash 2>/dev/null)\" != \"$$PKG_HASH\" ]; then
        npm install && echo \"$$PKG_HASH\" > node_modules/.pkg_hash;
      fi;
      npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
  philoagents_frontend_node_modules:
